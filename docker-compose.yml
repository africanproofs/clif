# clif deployment. `clif-epoch` is the always-on epoch-anchored sign→claim
# daemon (replaces the former `clif-auto` + `clif-fsp-auto` 15-min pollers);
# `clif` (profile: cli) is the one-shot used for the rehearsal ladder + manual ops.
#
# Networking: clif reaches fwd at FWD_ENDPOINT (default http://fwd:8080), which
# requires sharing fwd's Docker network. fwd's compose network is project-
# prefixed (typically `fwd_fwd-callers`); override via FWD_NETWORK in .env if
# different. If clif runs on another host, set FWD_ENDPOINT to a reachable URL
# and replace the external network with a normal bridge.
#
# Multichain (profile: multichain) — replaces the upstream `~/opt/signing-tool`
# hot-key signer. clif drives ONE shared fwd for Flare (14) ∥ Songbird (19) ∥
# Coston2 (114) in parallel: per network, ONE epoch daemon (`epoch run`) that
# sequences uptime(optional)→reward-sign→claim per reward epoch, each with its
# own gitignored `.env.<network>` and its own `CLIF_STATE_DIR`. Notes:
#  - Per-network `CLIF_STATE_DIR` (e.g. `.clif-state/flare`) is REQUIRED in
#    each `.env.<network>` (clean per-network status/logs/backups).
#  - Every process MUST boot keyless: no `*PRIVATE_KEY*` in env or the
#    resolved `.env.<network>` (config.assert_keyless). clif holds no keys.
#  - The daemon SIGNS, so it stays hard-disabled unless `FSP_AUTO_ENABLED=true`
#    in that network's env file (D15). The UPTIME phase is additionally gated by
#    `UPTIME_AUTO_ENABLED` (default false). Per-network fwd caller tokens are
#    operator-injected secrets (Core #12) — only in the gitignored
#    `.env.<network>`, never in this file.
# Run a single network's daemon, e.g.:
#   docker compose --profile multichain up -d clif-epoch-flare
# or all three networks:
#   docker compose --profile multichain up -d

services:
  clif-epoch:
    build: .
    image: clif:dev
    container_name: clif-epoch
    command: ["epoch", "run"]
    env_file: [.env]
    networks: [fwd-net, egress]
    restart: unless-stopped
    healthcheck:
      # `clif epoch status` exits non-zero when degraded or when the daemon is
      # dead/stale — the scrapeable money-path health signal.
      test: ["CMD", "clif", "epoch", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

  clif:
    build: .
    image: clif:dev
    profiles: ["cli"]
    env_file: [.env]
    networks: [fwd-net, egress]
    entrypoint: ["clif"]
    # one-shot, e.g.:  docker compose run --rm clif claim --type fee
    # rehearsal:        docker compose run --rm clif rehearse

  # --- Multichain (Flare ∥ Songbird ∥ Coston2), one shared fwd ---
  # Each service: own gitignored .env.<network> (NETWORK, CLIF_STATE_DIR,
  # FWD_ENDPOINT, the per-network FSP_*_CALLER_TOKEN + claim token secrets,
  # the per-network FSP_SIGNING_WALLET_NAME / FSP_SENDER_WALLET_NAME).

  clif-epoch-coston2:
    build: .
    image: clif:dev
    container_name: clif-epoch-coston2
    command: ["epoch", "run"]
    env_file: [.env.coston2]
    networks: [fwd-net, egress]
    profiles: ["multichain"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "epoch", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

  clif-epoch-songbird:
    build: .
    image: clif:dev
    container_name: clif-epoch-songbird
    command: ["epoch", "run"]
    env_file: [.env.songbird]
    networks: [fwd-net, egress]
    profiles: ["multichain"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "epoch", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

  clif-epoch-flare:
    build: .
    image: clif:dev
    container_name: clif-epoch-flare
    command: ["epoch", "run"]
    env_file: [.env.flare]
    networks: [fwd-net, egress]
    profiles: ["multichain"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clif", "epoch", "status"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 1200s

  # Keyless gas-funding daemons — keep the FSP accounts within their balance band
  # via fwd's ap-funder (native-transfer capability). Own cadence (15m), separate
  # from the epoch daemon; the epoch daemon SURFACES funding health each cycle so
  # it's visible during reward-signing, these ENFORCE it. Hard-off (FUNDING_ENABLED).
  clif-fund-songbird:
    build: .
    image: clif:dev
    container_name: clif-fund-songbird
    command: ["fund", "run"]
    env_file: [.env.songbird]
    networks: [fwd-net, egress]
    profiles: ["multichain"]
    restart: unless-stopped

  clif-fund-flare:
    build: .
    image: clif:dev
    container_name: clif-fund-flare
    command: ["fund", "run"]
    env_file: [.env.flare]
    networks: [fwd-net, egress]
    profiles: ["multichain"]
    restart: unless-stopped

  # Registration-readiness daemons (the RE423 detector) — OBSERVE-only, no key/token.
  # Boundary-aware: tightens cadence near the reward-epoch boundary (where the
  # registerVoter window opens for ~6.7 min). Reads the on-chain registered set +
  # window and logs a color-coded readiness line; NEVER signs. Hard-off
  # (REGISTRATION_ENABLED). Needs only egress (RPC reads); not on fwd-net.
  clif-registration-songbird:
    build: .
    image: clif:dev
    container_name: clif-registration-songbird
    command: ["registration", "run"]
    env_file: [.env.songbird]
    networks: [egress]
    profiles: ["multichain"]
    restart: unless-stopped

  clif-registration-flare:
    build: .
    image: clif:dev
    container_name: clif-registration-flare
    command: ["registration", "run"]
    env_file: [.env.flare]
    networks: [egress]
    profiles: ["multichain"]
    restart: unless-stopped

  # Per-block FTSO participation observer (fsp-observer native port, Phase 1).
  # OBSERVE-only: streams blocks and tracks AP's own submit/reveal per ~90s round.
  # Heavier than the other daemons (per-block) — points at an RPC that keeps up
  # (OBSERVE_RPC; an AP observer node in prod). Songbird canary first. Hard-off
  # (OBSERVE_ENABLED). Needs only egress (RPC reads); not on fwd-net.
  clif-observe-songbird:
    build: .
    image: clif:dev
    container_name: clif-observe-songbird
    command: ["observe", "run"]
    env_file: [.env.songbird]
    networks: [egress]
    profiles: ["multichain"]
    restart: unless-stopped

networks:
  fwd-net:
    external: true
    name: ${FWD_NETWORK:-fwd_fwd-callers}
  # Dual-homing (zero-egress fwd, v1.1.0a11+): fwd-net is `internal: true` (no
  # internet route), so clif ALSO attaches to this normal bridge for its own RPC
  # egress + broadcast + reward-distribution-data fetch. fwd is NOT on `egress`.
  egress:
    driver: bridge
